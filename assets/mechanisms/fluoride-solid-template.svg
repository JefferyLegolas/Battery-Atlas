<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">固态氟离子电池机制模板</title>
  <desc id="desc">示意放电时氟离子从金属氟化物正极迁移到金属负极并形成金属氟化物，充电时反向迁移。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10221c"/></marker>
    <marker id="arrow-acid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ff43"/></marker>
    <clipPath id="diagram-clip"><rect x="70" y="122" width="1060" height="500" rx="18"/></clipPath>
  </defs>
  <style>
    :root{--ink:#10221c;--muted:#69766f;--line:#d8ded9;--paper:#fff;--canvas:#f4f5f1;--acid:#d7ff43;--green:#137547;--orange:#ff6b35;--blue:#2156ff;--red:#c83d2f}
    text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace,Consolas,monospace}.muted{fill:var(--muted)}.tiny{font-size:13px}.label{font-size:15px;font-weight:700}.label-cn{font-size:18px;font-weight:800}.frame{fill:var(--paper);stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}.structure{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.cathode{fill:#fff0e9;stroke:var(--orange);stroke-width:2.5;vector-effect:non-scaling-stroke}.anode{fill:#edf1ff;stroke:var(--blue);stroke-width:2.5;vector-effect:non-scaling-stroke}.solid{fill:#f4fae0;stroke:var(--green);stroke-width:2.5;vector-effect:non-scaling-stroke}.grain{fill:none;stroke:var(--green);stroke-width:2.5;vector-effect:non-scaling-stroke}.ion{fill:var(--acid);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}.ion-text{font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.electron.electron-reverse{animation:electron 1.2s linear infinite reverse}.electron{fill:none;stroke:var(--acid);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:9 13;animation:electron 1.2s linear infinite}.phase-discharge{animation:discharge 5s linear infinite}.phase-charge{animation:charge 5s linear infinite}.ions-discharge{animation:ionsDischarge 5s ease-in-out infinite}.ions-charge{animation:ionsCharge 5s ease-in-out infinite}.volume{animation:volume 5s ease-in-out infinite}
    @keyframes electron{to{stroke-dashoffset:-44}}@keyframes discharge{0%,44%{opacity:1}49%,100%{opacity:0}}@keyframes charge{0%,49%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}@keyframes ionsDischarge{0%,8%{opacity:0;transform:translateX(0)}15%,42%{opacity:1;transform:translateX(310px)}48%,100%{opacity:0;transform:translateX(310px)}}@keyframes ionsCharge{0%,50%{opacity:0;transform:translateX(0)}58%,84%{opacity:1;transform:translateX(-310px)}92%,100%{opacity:0;transform:translateX(-310px)}}@keyframes volume{0%,12%{transform:scale(1)}48%,58%{transform:scale(1.08)}90%,100%{transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){.electron,.phase-discharge,.phase-charge,.ions-discharge,.ions-charge,.volume{animation:none!important}.phase-charge,.ions-charge{opacity:0}.phase-discharge,.ions-discharge{opacity:1}.ions-discharge{transform:translateX(160px)}.volume{transform:scale(1.08)}}
  </style>
  <rect width="1200" height="760" fill="var(--canvas)"/>
  <g transform="translate(60 48)"><text class="tiny muted mono" x="0" y="14">FLUORIDE-ION / SOLID ELECTROLYTE</text><text class="label-cn" x="0" y="52">固态氟离子机制模板</text><text class="muted tiny" x="0" y="78">F⁻ SHUTTLE · METAL FLUORIDE INTERFACE · VOLUME CHANGE</text><rect x="1000" y="12" width="80" height="28" rx="14" fill="#e7f6dc" stroke="var(--green)" stroke-width="1.5"/><circle cx="1018" cy="26" r="4" fill="var(--green)"/><text class="tiny" x="1030" y="31" fill="var(--green)">5 s loop</text></g>
  <rect x="70" y="122" width="1060" height="500" rx="18" class="frame"/>
  <g clip-path="url(#diagram-clip)">
    <rect x="120" y="190" width="18" height="364" rx="4" fill="var(--ink)"/><rect x="1062" y="190" width="18" height="364" rx="4" fill="var(--ink)"/>
    <rect x="150" y="190" width="270" height="364" rx="8" class="cathode"/><text class="label" x="180" y="232" fill="var(--orange)">金属氟化物正极</text><text class="tiny muted mono" x="180" y="255">MFₙ / oxyfluoride</text>
    <rect x="450" y="190" width="300" height="364" rx="8" class="solid"/><text class="label" x="480" y="232" fill="var(--green)">固态 F⁻ 电解质</text><text class="tiny muted mono" x="480" y="255">LaF₃-based conductor</text>
    <rect x="780" y="190" width="270" height="364" rx="8" class="anode"/><text class="label" x="810" y="232" fill="var(--blue)">金属 / MFₙ 负极</text><text class="tiny muted mono" x="810" y="255">metal / metal fluoride</text>
    <path d="M500 275 L560 320 L520 360 L610 400 L550 450 L650 500" class="grain"/><path d="M475 445 L540 405 L590 470 L655 420 L720 480" class="grain"/>
    <g class="ions-discharge"><circle class="ion" cx="330" cy="350" r="14"/><text class="ion-text" x="330" y="351">F⁻</text><circle class="ion" cx="390" cy="410" r="14"/><text class="ion-text" x="390" y="411">F⁻</text><circle class="ion" cx="450" cy="360" r="14"/><text class="ion-text" x="450" y="361">F⁻</text></g>
    <g class="ions-charge"><circle class="ion" cx="820" cy="350" r="14"/><text class="ion-text" x="820" y="351">F⁻</text><circle class="ion" cx="760" cy="410" r="14"/><text class="ion-text" x="760" y="411">F⁻</text><circle class="ion" cx="700" cy="360" r="14"/><text class="ion-text" x="700" y="361">F⁻</text></g>
    <g class="phase-discharge"><text class="tiny" x="600" y="310" text-anchor="middle">放电：F⁻ 迁移 → 金属侧形成氟化物</text><path d="M300 486 L900 486" class="structure" marker-end="url(#arrow-ink)"/></g>
    <g class="phase-charge"><text class="tiny" x="600" y="310" text-anchor="middle">充电：F⁻ 回迁 → 金属氟化物再生</text><path d="M900 486 L300 486" class="structure" marker-end="url(#arrow-ink)"/></g>
    <g class="phase-discharge"><path d="M1050 150 C840 90 360 90 140 150" class="electron" marker-end="url(#arrow-acid)"/></g><g class="phase-charge"><path d="M140 150 C360 90 840 90 1050 150" class="electron electron-reverse" marker-end="url(#arrow-acid)"/></g><text class="tiny muted" x="600" y="108" text-anchor="middle">外电路 · e⁻ 随充放电反向</text>
    <ellipse cx="960" cy="390" rx="42" ry="76" class="volume" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-dasharray="6 8"/><text class="tiny" x="960" y="510" text-anchor="middle" fill="var(--red)">体积 / 界面变化</text>
    <text class="tiny muted" x="600" y="535" text-anchor="middle">工作离子为 F⁻ · 不使用锂枝晶模型</text>
  </g>
  <g transform="translate(70 650)"><text class="tiny muted mono" x="0" y="0">VISUAL LANGUAGE</text><g transform="translate(0 22)"><rect x="0" y="0" width="16" height="16" rx="4" fill="#fff0e9" stroke="var(--orange)" stroke-width="2"/><text class="tiny" x="26" y="13">金属氟化物</text><circle cx="210" cy="8" r="7" fill="var(--acid)" stroke="var(--ink)" stroke-width="2"/><text class="tiny" x="226" y="13">F⁻ 工作离子</text><rect x="410" y="0" width="16" height="16" rx="4" fill="#f4fae0" stroke="var(--green)" stroke-width="2"/><text class="tiny" x="436" y="13">固态 F⁻ 电解质</text><ellipse cx="680" cy="8" rx="13" ry="8" fill="none" stroke="var(--red)" stroke-width="2.5"/><text class="tiny" x="702" y="13">体积 / 界面变化</text></g><text class="tiny muted" x="0" y="66">统一规则：F⁻ 工作离子 · 固态氟化物导体 · 界面反应和体积变化可见 · 5 秒循环</text></g>
</svg>
