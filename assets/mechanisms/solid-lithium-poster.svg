<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 122 1060 500" role="img" aria-labelledby="title desc">
  <title id="title">固态锂型电池机制模板</title>
  <desc id="desc">示意锂离子通过固体电解质和晶界传输，以及界面接触、压力和锂枝晶风险。</desc>
  <defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10221c"/></marker><marker id="arrow-acid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ff43"/></marker><clipPath id="diagram-clip"><rect x="70" y="122" width="1060" height="500" rx="18"/></clipPath></defs>
  <style>
    :root{--ink:#10221c;--muted:#69766f;--line:#d8ded9;--paper:#fff;--canvas:#f4f5f1;--acid:#d7ff43;--green:#137547;--orange:#ff6b35;--blue:#2156ff;--red:#c83d2f}
    text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace,Consolas,monospace}.muted{fill:var(--muted)}.tiny{font-size:13px}.label{font-size:15px;font-weight:700}.label-cn{font-size:18px;font-weight:800}.frame{fill:var(--paper);stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}.structure{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.hairline{fill:none;stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}.cathode{fill:#fff0e9;stroke:var(--orange);stroke-width:2.5;vector-effect:non-scaling-stroke}.anode{fill:#edf1ff;stroke:var(--blue);stroke-width:2.5;vector-effect:non-scaling-stroke}.solid{fill:#f4fae0;stroke:var(--green);stroke-width:2.5;vector-effect:non-scaling-stroke}.grain{fill:#edf7ef;stroke:var(--green);stroke-width:1.5;stroke-dasharray:6 7;vector-effect:non-scaling-stroke}.ion-path{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 10;vector-effect:non-scaling-stroke}.ion{fill:var(--acid);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}.ion-text{font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.electron{fill:none;stroke:var(--acid);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:9 13;animation:electron 1.2s linear infinite}.electron-reverse{animation:electron 1.2s linear infinite reverse}.dendrite{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:dendrite 5s ease-in-out infinite}.pressure{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:pressure 5s ease-in-out infinite}.phase-discharge{animation:discharge 5s linear infinite}.phase-charge{animation:charge 5s linear infinite}.ions-discharge{animation:ionsDischarge 5s ease-in-out infinite}.ions-charge{animation:ionsCharge 5s ease-in-out infinite}
    @keyframes electron{to{stroke-dashoffset:-44}}@keyframes dendrite{0%,55%,100%{opacity:0}70%,88%{opacity:1}}@keyframes pressure{0%,15%,85%,100%{opacity:.25}48%,58%{opacity:1}}@keyframes discharge{0%,44%{opacity:1}49%,100%{opacity:0}}@keyframes charge{0%,49%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}@keyframes ionsDischarge{0%,8%{opacity:0;transform:translateX(0)}15%,42%{opacity:1;transform:translateX(-310px)}48%,100%{opacity:0;transform:translateX(-310px)}}@keyframes ionsCharge{0%,50%{opacity:0;transform:translateX(0)}58%,84%{opacity:1;transform:translateX(310px)}92%,100%{opacity:0;transform:translateX(310px)}}
    @media(prefers-reduced-motion:reduce){.electron,.electron-reverse,.dendrite,.pressure,.phase-discharge,.phase-charge,.ions-discharge,.ions-charge{animation:none!important}.dendrite{opacity:1}.pressure{opacity:1}.phase-charge,.ions-charge{opacity:0}.phase-discharge,.ions-discharge{opacity:1}.ions-discharge{transform:translateX(-155px)}}
  
    *{animation:none!important}
    .phase-discharge,.ions-discharge{opacity:1!important}
    .phase-charge,.ions-charge{opacity:0!important}
    .ions-discharge{transform:translateX(-155px)!important}
    .dendrite,.pressure{opacity:1!important}
  </style>
  <rect width="1200" height="760" fill="var(--canvas)"/>
  <g transform="translate(60 48)"><text class="tiny muted mono" x="0" y="14">SOLID-STATE LITHIUM / GRAIN BOUNDARY + INTERFACE</text><text class="label-cn" x="0" y="52">固态锂型机制模板</text><text class="muted tiny" x="0" y="78">LI⁺ CONDUCTION · INTERFACE · PRESSURE · DENDRITE RISK</text><rect x="1000" y="12" width="80" height="28" rx="14" fill="#e7f6dc" stroke="var(--green)" stroke-width="1.5"/><circle cx="1018" cy="26" r="4" fill="var(--green)"/><text class="tiny" x="1030" y="31" fill="var(--green)">5 s loop</text></g>
  <rect x="70" y="122" width="1060" height="500" rx="18" class="frame"/><g clip-path="url(#diagram-clip)">
    <rect x="130" y="190" width="250" height="364" rx="8" class="cathode"/><text class="label" x="160" y="232" fill="var(--orange)">复合正极</text><text class="tiny muted mono" x="160" y="255">active material + ion conductor</text>
    <rect x="440" y="190" width="330" height="364" rx="8" class="solid"/><text class="label" x="470" y="232" fill="var(--green)">固体电解质</text><text class="tiny muted mono" x="470" y="255">grain / grain boundary</text>
    <rect x="830" y="190" width="250" height="364" rx="8" class="anode"/><text class="label" x="860" y="232" fill="var(--blue)">负极 / 合金或金属</text><text class="tiny muted mono" x="860" y="255">volume change + interface</text>
    <path class="grain" d="M470 255 L555 225 L615 300 L525 340 Z"/><path class="grain" d="M615 300 L725 250 L742 360 L660 390 Z"/><path class="grain" d="M470 350 L525 340 L590 420 L510 470 Z"/><path class="grain" d="M660 390 L742 360 L730 480 L620 500 Z"/><path class="grain" d="M510 470 L590 420 L680 480 L530 520 Z"/><path class="ion-path" d="M470 390 C520 345 590 450 650 390 S710 345 745 375" marker-end="url(#arrow-ink)"/><text class="tiny" x="575" y="505" fill="var(--green)">绿色虚线：晶界</text><text class="tiny" x="650" y="360">黑点线：离子通道</text>
    <g class="ions-discharge"><circle class="ion" cx="720" cy="370" r="13"/><text class="ion-text" x="720" y="371">Li⁺</text><circle class="ion" cx="660" cy="410" r="13"/><text class="ion-text" x="660" y="411">Li⁺</text><circle class="ion" cx="600" cy="370" r="13"/><text class="ion-text" x="600" y="371">Li⁺</text></g><g class="ions-charge"><circle class="ion" cx="340" cy="370" r="13"/><text class="ion-text" x="340" y="371">Li⁺</text><circle class="ion" cx="395" cy="410" r="13"/><text class="ion-text" x="395" y="411">Li⁺</text><circle class="ion" cx="450" cy="370" r="13"/><text class="ion-text" x="450" y="371">Li⁺</text></g>
    <g class="phase-discharge"><text class="tiny" x="600" y="310" text-anchor="middle">放电：Li⁺ 从负极侧进入电解质 → 正极嵌入</text><path d="M900 486 L300 486" class="structure" marker-end="url(#arrow-ink)"/></g><g class="phase-charge"><text class="tiny" x="600" y="310" text-anchor="middle">充电：Li⁺ 从正极侧进入电解质 → 负极嵌入</text><path d="M300 486 L900 486" class="structure" marker-end="url(#arrow-ink)"/></g>
    <path d="M850 500 L880 465 L900 490 L925 450" class="dendrite"/><text class="tiny" x="900" y="430" fill="var(--red)">枝晶风险</text>
    <path d="M835 158 L905 158" class="pressure"/><path d="M870 160 L870 185" class="pressure" marker-end="url(#arrow-ink)"/><text class="tiny muted" x="870" y="145" text-anchor="middle">压力 / pressure</text>
    <path d="M950 190 L950 450" class="structure"/><text class="tiny muted" x="965" y="340">界面阻抗</text>
    <g class="phase-discharge"><path d="M1050 150 C840 90 360 90 140 150" class="electron" marker-end="url(#arrow-acid)"/></g><g class="phase-charge"><path d="M140 150 C360 90 840 90 1050 150" class="electron electron-reverse" marker-end="url(#arrow-acid)"/></g><text class="tiny muted" x="600" y="108" text-anchor="middle">外电路 · e⁻ 随充放电反向</text><text class="tiny muted" x="600" y="535" text-anchor="middle">界面与晶界决定阻抗；压力与锂枝晶需单独评估</text>
  </g>
  <g transform="translate(70 650)"><text class="tiny muted mono" x="0" y="0">VISUAL LANGUAGE</text><g transform="translate(0 22)"><rect x="0" y="0" width="16" height="16" rx="4" fill="#edf7ef" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 5"/><text class="tiny" x="26" y="13">晶界</text><path d="M120 8 L166 8" stroke="var(--ink)" stroke-width="3" stroke-dasharray="2 9"/><text class="tiny" x="178" y="13">离子通道</text><circle cx="230" cy="8" r="7" fill="var(--acid)" stroke="var(--ink)" stroke-width="2"/><text class="tiny" x="246" y="13">Li⁺ 离子路径</text><path d="M430 8 L476 8" stroke="var(--red)" stroke-width="3"/><text class="tiny" x="488" y="13">枝晶 / 失效风险</text><path d="M680 8 L726 8" stroke="var(--ink)" stroke-width="2.5"/><text class="tiny" x="738" y="13">压力 / 界面</text></g><text class="tiny muted" x="0" y="66">统一规则：无液相孔隙 · 连续离子路径 · 晶界可见 · 界面状态明确 · 5 秒循环</text></g>
</svg>
