<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 122 1060 500" role="img" aria-labelledby="title desc">
  <title id="title">液流型电池机制模板</title>
  <desc id="desc">示意正负极电解液分别储存在外部储罐中，通过泵循环进入电堆，离子穿过离子交换膜，电子经外电路流动。</desc>
  <defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10221c"/></marker><marker id="arrow-acid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ff43"/></marker><clipPath id="diagram-clip"><rect x="70" y="122" width="1060" height="500" rx="18"/></clipPath></defs>
  <style>
    :root{--ink:#10221c;--muted:#69766f;--line:#d8ded9;--paper:#fff;--canvas:#f4f5f1;--acid:#d7ff43;--green:#137547;--orange:#ff6b35;--blue:#2156ff}
    text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace,Consolas,monospace}.muted{fill:var(--muted)}.tiny{font-size:13px}.label{font-size:15px;font-weight:700}.label-cn{font-size:18px;font-weight:800}.frame{fill:var(--paper);stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}.structure{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.hairline{fill:none;stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}.tank-pos{fill:#fff0e9;stroke:var(--orange);stroke-width:2.5;vector-effect:non-scaling-stroke}.tank-neg{fill:#edf1ff;stroke:var(--blue);stroke-width:2.5;vector-effect:non-scaling-stroke}.cell{fill:#fff;stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}.membrane{stroke:var(--green);stroke-width:3;stroke-dasharray:6 8;vector-effect:non-scaling-stroke}.pump{fill:var(--acid);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}.flow{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:8 10;animation:flow 1.4s linear infinite}.ion{fill:var(--acid);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}.ion-text{font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.electron{fill:none;stroke:var(--acid);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:9 13;animation:electron 1.2s linear infinite}.cycle{animation:cycle 5s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-36}}@keyframes electron{to{stroke-dashoffset:-44}}@keyframes cycle{0%,46%{opacity:1}50%,100%{opacity:.25}}
    @media(prefers-reduced-motion:reduce){.flow,.electron,.cycle{animation:none!important}.cycle{opacity:1}}
  
    *{animation:none!important}
    .cycle{opacity:1!important}
  </style>
  <rect width="1200" height="760" fill="var(--canvas)"/>
  <g transform="translate(60 48)"><text class="tiny muted mono" x="0" y="14">REDOX FLOW / TANK + STACK</text><text class="label-cn" x="0" y="52">液流型电池机制模板</text><text class="muted tiny" x="0" y="78">ELECTROLYTE CIRCULATION · MEMBRANE · EXTERNAL CIRCUIT</text><rect x="1000" y="12" width="80" height="28" rx="14" fill="#e7f6dc" stroke="var(--green)" stroke-width="1.5"/><circle cx="1018" cy="26" r="4" fill="var(--green)"/><text class="tiny" x="1030" y="31" fill="var(--green)">5 s loop</text></g>
  <rect x="70" y="122" width="1060" height="500" rx="18" class="frame"/><g clip-path="url(#diagram-clip)">
    <rect x="140" y="285" width="175" height="205" rx="18" class="tank-pos"/><text class="label" x="175" y="330">正极电解液罐</text><text class="tiny muted mono" x="175" y="354">V⁴⁺ / V⁵⁺</text>
    <rect x="885" y="285" width="175" height="205" rx="18" class="tank-neg"/><text class="label" x="920" y="330">负极电解液罐</text><text class="tiny muted mono" x="920" y="354">V²⁺ / V³⁺</text>
    <rect x="430" y="220" width="340" height="330" rx="12" class="cell"/><text class="label" x="470" y="258">电堆 / Stack</text><line x1="600" y1="285" x2="600" y2="520" class="membrane"/><text class="tiny" x="612" y="405">离子交换膜</text>
    <circle cx="275" cy="555" r="24" class="pump"/><text class="tiny" x="275" y="560" text-anchor="middle">泵</text><circle cx="925" cy="555" r="24" class="pump"/><text class="tiny" x="925" y="560" text-anchor="middle">泵</text>
    <path d="M315 520 C350 585 395 585 430 520" class="flow"/><path d="M770 520 C805 585 850 585 885 520" class="flow"/><path d="M315 250 C350 175 395 175 430 250" class="flow"/><path d="M770 250 C805 175 850 175 885 250" class="flow"/>
    <g class="cycle"><circle class="ion" cx="505" cy="392" r="13"/><text class="ion-text" x="505" y="393">H⁺</text><circle class="ion" cx="548" cy="392" r="13"/><text class="ion-text" x="548" y="393">H⁺</text><circle class="ion" cx="650" cy="392" r="13"/><text class="ion-text" x="650" y="393">H⁺</text></g>
    <path d="M915 175 C770 98 430 98 285 175" class="structure" marker-end="url(#arrow-ink)"/><path d="M285 175 C430 98 770 98 915 175" class="electron" marker-end="url(#arrow-acid)"/><text class="tiny muted" x="600" y="125" text-anchor="middle">外电路 · 电子流动</text>
    <text class="tiny" x="600" y="300" text-anchor="middle">电解液循环驱动氧化还原反应</text>
  </g>
  <g transform="translate(70 650)"><text class="tiny muted mono" x="0" y="0">VISUAL LANGUAGE</text><g transform="translate(0 22)"><rect x="0" y="0" width="16" height="16" rx="4" fill="#fff0e9" stroke="var(--orange)" stroke-width="2"/><text class="tiny" x="26" y="13">正极电解液</text><rect x="210" y="0" width="16" height="16" rx="4" fill="#edf1ff" stroke="var(--blue)" stroke-width="2"/><text class="tiny" x="236" y="13">负极电解液</text><circle cx="430" cy="8" r="7" fill="var(--acid)" stroke="var(--ink)" stroke-width="2"/><text class="tiny" x="446" y="13">工作离子</text><line x1="590" y1="8" x2="636" y2="8" stroke="var(--green)" stroke-width="3" stroke-dasharray="8 8"/><text class="tiny" x="648" y="13">电解液循环</text><line x1="820" y1="8" x2="866" y2="8" stroke="var(--acid)" stroke-width="3" stroke-dasharray="8 8"/><text class="tiny" x="878" y="13">e⁻ 电子</text></g><text class="tiny muted" x="0" y="66">统一规则：外部储罐 · 泵循环 · 离子交换膜 · 极耳外电路 · 5 秒循环</text></g>
</svg>
