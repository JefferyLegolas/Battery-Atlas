<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 122 1060 500" role="img" aria-labelledby="title desc">
  <title id="title">高温钠硫电池机制模板</title>
  <desc id="desc">示意熔融钠负极和熔融硫、多硫化物正极通过 β-氧化铝陶瓷隔膜传输钠离子，并伴随高温、密封和腐蚀约束。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10221c"/></marker>
    <marker id="arrow-acid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ff43"/></marker>
    <clipPath id="diagram-clip"><rect x="70" y="122" width="1060" height="500" rx="18"/></clipPath>
  </defs>
  <style>
    :root{--ink:#10221c;--muted:#69766f;--line:#d8ded9;--paper:#fff;--canvas:#f4f5f1;--acid:#d7ff43;--green:#137547;--orange:#ff6b35;--blue:#2156ff;--red:#c83d2f}
    text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace,Consolas,monospace}.muted{fill:var(--muted)}.tiny{font-size:13px}.label{font-size:15px;font-weight:700}.label-cn{font-size:18px;font-weight:800}.frame{fill:var(--paper);stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}.structure{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.na-melt{fill:#edf1ff;stroke:var(--blue);stroke-width:2.5;vector-effect:non-scaling-stroke}.s-melt{fill:#fff0e9;stroke:var(--orange);stroke-width:2.5;vector-effect:non-scaling-stroke}.beta{fill:#f4fae0;stroke:var(--green);stroke-width:2.5;vector-effect:non-scaling-stroke}.channel{fill:#edf7ef;stroke:var(--green);stroke-width:1.5;stroke-dasharray:6 7;vector-effect:non-scaling-stroke}.ion-path{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 10;vector-effect:non-scaling-stroke}.ion{fill:var(--acid);stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}.ion-text{font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.electron.electron-reverse{animation:electron 1.2s linear infinite reverse}.electron{fill:none;stroke:var(--acid);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:9 13;animation:electron 1.2s linear infinite}.heat{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:heat 5s ease-in-out infinite}.phase-discharge{animation:discharge 5s linear infinite}.phase-charge{animation:charge 5s linear infinite}.ions-discharge{animation:ionsDischarge 5s ease-in-out infinite}.ions-charge{animation:ionsCharge 5s ease-in-out infinite}
    @keyframes electron{to{stroke-dashoffset:-44}}@keyframes heat{0%,20%,80%,100%{opacity:.25}50%,65%{opacity:1}}@keyframes discharge{0%,44%{opacity:1}49%,100%{opacity:0}}@keyframes charge{0%,49%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}@keyframes ionsDischarge{0%,8%{opacity:0;transform:translateX(0)}15%,42%{opacity:1;transform:translateX(290px)}48%,100%{opacity:0;transform:translateX(290px)}}@keyframes ionsCharge{0%,50%{opacity:0;transform:translateX(0)}58%,84%{opacity:1;transform:translateX(-290px)}92%,100%{opacity:0;transform:translateX(-290px)}}
    @media(prefers-reduced-motion:reduce){.electron,.heat,.phase-discharge,.phase-charge,.ions-discharge,.ions-charge{animation:none!important}.phase-charge,.ions-charge{opacity:0}.phase-discharge,.ions-discharge{opacity:1}.ions-discharge{transform:translateX(145px)}.heat{opacity:1}}
  
    *{animation:none!important}
    .phase-discharge,.ions-discharge{opacity:1!important}
    .phase-charge,.ions-charge{opacity:0!important}
    .ions-discharge{transform:translateX(145px)!important}
    .heat{opacity:1!important}
  </style>
  <rect width="1200" height="760" fill="var(--canvas)"/>
  <g transform="translate(60 48)"><text class="tiny muted mono" x="0" y="14">MOLTEN Na / β-ALUMINA / MOLTEN S</text><text class="label-cn" x="0" y="52">高温钠硫机制模板</text><text class="muted tiny" x="0" y="78">Na⁺ TRANSPORT · 300–350 °C · SEALING + CORROSION</text><rect x="970" y="12" width="110" height="28" rx="14" fill="#fff0e9" stroke="var(--red)" stroke-width="1.5"/><circle cx="988" cy="26" r="4" fill="var(--red)"/><text class="tiny" x="1000" y="31" fill="var(--red)">300–350 °C</text></g>
  <rect x="70" y="122" width="1060" height="500" rx="18" class="frame"/>
  <g clip-path="url(#diagram-clip)">
    <rect x="120" y="190" width="270" height="364" rx="28" class="na-melt"/><path d="M142 270 C180 250 220 290 260 265 C300 240 340 285 370 265 L370 190 L142 190 Z" fill="#dce6ff" opacity=".65"/><text class="label" x="155" y="232" fill="var(--blue)">熔融 Na 负极</text><text class="tiny muted mono" x="155" y="255">liquid sodium</text>
    <rect x="450" y="190" width="300" height="364" rx="12" class="beta"/><text class="label" x="480" y="232" fill="var(--green)">β-氧化铝陶瓷隔膜</text><text class="tiny muted mono" x="480" y="255">Na⁺ conducting ceramic</text><path class="channel" d="M470 255 L555 225 L615 300 L525 340 Z"/><path class="channel" d="M615 300 L725 250 L742 360 L660 390 Z"/><path class="channel" d="M470 350 L525 340 L590 420 L510 470 Z"/><path class="channel" d="M660 390 L742 360 L730 480 L620 500 Z"/><path class="channel" d="M510 470 L590 420 L680 480 L530 520 Z"/><path class="ion-path" d="M470 390 L745 390" marker-end="url(#arrow-ink)"/><text class="tiny" x="570" y="505" fill="var(--green)">绿色虚线：晶界</text><text class="tiny" x="650" y="360">黑点线：Na⁺ 通道</text>
    <rect x="810" y="190" width="270" height="364" rx="28" class="s-melt"/><path d="M832 275 C870 250 910 295 950 265 C990 240 1030 285 1058 265 L1058 190 L832 190 Z" fill="#ffe0d2" opacity=".7"/><text class="label" x="845" y="232" fill="var(--orange)">熔融 S / 多硫化物</text><text class="tiny muted mono" x="845" y="255">S / Na₂Sₓ</text>
    <g class="ions-discharge"><circle class="ion" cx="330" cy="350" r="14"/><text class="ion-text" x="330" y="351">Na⁺</text><circle class="ion" cx="390" cy="410" r="14"/><text class="ion-text" x="390" y="411">Na⁺</text><circle class="ion" cx="450" cy="360" r="14"/><text class="ion-text" x="450" y="361">Na⁺</text></g>
    <g class="ions-charge"><circle class="ion" cx="820" cy="350" r="14"/><text class="ion-text" x="820" y="351">Na⁺</text><circle class="ion" cx="760" cy="410" r="14"/><text class="ion-text" x="760" y="411">Na⁺</text><circle class="ion" cx="700" cy="360" r="14"/><text class="ion-text" x="700" y="361">Na⁺</text></g>
    <g class="phase-discharge"><text class="tiny" x="600" y="310" text-anchor="middle">放电：Na⁺ 穿过陶瓷隔膜 → 多硫化物形成</text><path d="M300 486 L900 486" class="structure" marker-end="url(#arrow-ink)"/></g>
    <g class="phase-charge"><text class="tiny" x="600" y="310" text-anchor="middle">充电：Na⁺ 回迁 → 钠与硫重新分离</text><path d="M900 486 L300 486" class="structure" marker-end="url(#arrow-ink)"/></g>
    <g class="phase-discharge"><path d="M1050 150 C840 90 360 90 140 150" class="electron" marker-end="url(#arrow-acid)"/></g><g class="phase-charge"><path d="M140 150 C360 90 840 90 1050 150" class="electron electron-reverse" marker-end="url(#arrow-acid)"/></g><text class="tiny muted" x="600" y="108" text-anchor="middle">外电路 · e⁻ 随充放电反向</text>
    <path d="M870 165 C890 145 910 145 930 165 M900 160 C920 140 940 140 960 160" class="heat"/><text class="tiny" x="900" y="145" text-anchor="middle" fill="var(--red)">热管理 / 密封</text>
    <path d="M990 320 C1020 330 1020 400 990 430" class="heat"/><text class="tiny" x="1020" y="390" fill="var(--red)">腐蚀</text>
    <text class="tiny muted" x="600" y="535" text-anchor="middle">工作离子为 Na⁺ · 不使用锂离子、压力或枝晶语义</text>
  </g>
  <g transform="translate(70 650)"><text class="tiny muted mono" x="0" y="0">VISUAL LANGUAGE</text><g transform="translate(0 22)"><rect x="0" y="0" width="16" height="16" rx="4" fill="#edf1ff" stroke="var(--blue)" stroke-width="2"/><text class="tiny" x="26" y="13">熔融 Na</text><circle cx="180" cy="8" r="7" fill="var(--acid)" stroke="var(--ink)" stroke-width="2"/><text class="tiny" x="196" y="13">Na⁺ 工作离子</text><rect x="380" y="0" width="16" height="16" rx="4" fill="#edf7ef" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 5"/><text class="tiny" x="406" y="13">β-氧化铝晶界</text><path d="M535 8 L581 8" stroke="var(--ink)" stroke-width="3" stroke-dasharray="2 9"/><text class="tiny" x="593" y="13">Na⁺ 通道</text><rect x="700" y="0" width="16" height="16" rx="4" fill="#fff0e9" stroke="var(--orange)" stroke-width="2"/><text class="tiny" x="726" y="13">熔融 S / Na₂Sₓ</text><path d="M920 8 C940 -5 960 20 980 8" fill="none" stroke="var(--red)" stroke-width="2.5"/><text class="tiny" x="992" y="13">热 / 密封 / 腐蚀</text></g><text class="tiny muted" x="0" y="66">统一规则：熔融电极 · β-氧化铝陶瓷隔膜 · Na⁺ 路径 · 高温和密封约束 · 5 秒循环</text></g>
</svg>
