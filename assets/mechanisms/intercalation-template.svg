<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">嵌入型电池机制模板</title>
  <desc id="desc">二维剖面示意图：工作离子在正极和负极宿主结构之间嵌入与脱出，电子经外电路流动。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10221c"/>
    </marker>
    <marker id="arrow-acid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ff43"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2156ff"/>
    </marker>
    <clipPath id="diagram-clip">
      <rect x="70" y="122" width="1060" height="500" rx="18"/>
    </clipPath>
  </defs>
  <style>
    :root {
      --ink: #10221c;
      --muted: #69766f;
      --line: #d8ded9;
      --paper: #ffffff;
      --canvas: #f4f5f1;
      --acid: #d7ff43;
      --green: #137547;
      --orange: #ff6b35;
      --blue: #2156ff;
      --red: #c83d2f;
    }
    text { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .muted { fill: var(--muted); }
    .tiny { font-size: 13px; letter-spacing: .04em; }
    .label { font-size: 15px; font-weight: 700; }
    .label-cn { font-size: 18px; font-weight: 800; }
    .stroke { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .hairline { fill: none; stroke: var(--line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .structure { fill: none; stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .cathode { fill: #fff0e9; stroke: var(--orange); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .anode { fill: #edf1ff; stroke: var(--blue); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .electrolyte { fill: #f4fae0; stroke: var(--green); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .current-collector { fill: var(--ink); stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .ion { fill: var(--acid); stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    .ion-text { font-size: 11px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    .electron { fill: none; stroke: var(--acid); stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 9 13; }
    .electron-charge { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 9 13; }
    .flow-line { fill: none; stroke: var(--green); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-dasharray: 6 10; }
    .frame { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .phase-discharge { animation: phaseDischarge 5s linear infinite; }
    .phase-charge { animation: phaseCharge 5s linear infinite; }
    .discharge-flow { animation: dischargeFlow 5s linear infinite; }
    .charge-flow { animation: chargeFlow 5s linear infinite; }
    .discharge-label { animation: phaseDischarge 5s linear infinite; }
    .charge-label { animation: phaseCharge 5s linear infinite; }
    .dash-discharge { animation: dashMove 1.2s linear infinite; }
    .dash-charge { animation: dashMoveReverse 1.2s linear infinite; }
    @keyframes phaseDischarge {
      0%, 44% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes phaseCharge {
      0%, 49% { opacity: 0; }
      54%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes dischargeFlow {
      0%, 4% { opacity: 0; transform: translateX(0); }
      10% { opacity: 1; }
      42% { opacity: 1; transform: translateX(300px); }
      47%, 100% { opacity: 0; transform: translateX(300px); }
    }
    @keyframes chargeFlow {
      0%, 49% { opacity: 0; transform: translateX(0); }
      54% { opacity: 1; }
      86% { opacity: 1; transform: translateX(-300px); }
      92%, 100% { opacity: 0; transform: translateX(-300px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -44; }
    }
    @keyframes dashMoveReverse {
      to { stroke-dashoffset: 44; }
    }
    @media (prefers-reduced-motion: reduce) {
      .phase-discharge, .phase-charge, .discharge-flow, .charge-flow, .discharge-label, .charge-label, .dash-discharge, .dash-charge { animation: none !important; }
      .phase-charge, .charge-flow, .charge-label { opacity: 0; }
      .phase-discharge, .discharge-flow, .discharge-label { opacity: 1; }
    }
  </style>
  <rect width="1200" height="760" fill="var(--canvas)"/>
  <g transform="translate(60 48)">
    <text class="tiny muted mono" x="0" y="14">INTERCALATION / ROCKING CHAIR</text>
    <text class="label-cn" x="0" y="52">工作离子嵌入 / 脱出机制</text>
    <text class="muted tiny" x="0" y="78">HOST INSERTION · DEINSERTION · REVERSIBLE STORAGE</text>
    <rect x="1000" y="12" width="80" height="28" rx="14" fill="#e7f6dc" stroke="var(--green)" stroke-width="1.5"/>
    <circle cx="1018" cy="26" r="4" fill="var(--green)"/>
    <text class="tiny" x="1030" y="31" fill="var(--green)">5 s loop</text>
  </g>

  <rect x="70" y="122" width="1060" height="500" rx="18" class="frame"/>
  <g clip-path="url(#diagram-clip)">
    <line x1="130" y1="182" x2="130" y2="562" class="structure"/>
    <line x1="1070" y1="182" x2="1070" y2="562" class="structure"/>
    <rect x="112" y="190" width="18" height="364" rx="4" class="current-collector"/>
    <rect x="1070" y="190" width="18" height="364" rx="4" class="current-collector"/>
    <rect x="150" y="190" width="330" height="364" rx="8" class="cathode"/>
    <rect x="480" y="190" width="240" height="364" rx="8" class="electrolyte"/>
    <rect x="720" y="190" width="330" height="364" rx="8" class="anode"/>

    <text class="label" x="184" y="232" fill="var(--orange)">正极 · 宿主材料</text>
    <text class="tiny muted mono" x="184" y="255">HOST STRUCTURE</text>
    <text class="label" x="754" y="232" fill="var(--blue)">负极 · 嵌入型负极</text>
    <text class="tiny muted mono" x="754" y="255">HOST / INTERCALATED</text>
    <text class="label" x="510" y="232" fill="var(--green)">电解液 + 隔膜</text>
    <text class="tiny muted mono" x="510" y="255">M⁺ transport</text>

    <g class="flow-line">
      <line x1="418" y1="355" x2="447" y2="355"/>
      <line x1="474" y1="355" x2="503" y2="355"/>
      <line x1="530" y1="355" x2="559" y2="355"/>
      <line x1="586" y1="355" x2="615" y2="355"/>
      <line x1="642" y1="355" x2="671" y2="355"/>
      <line x1="698" y1="355" x2="720" y2="355"/>
    </g>

    <g class="discharge-flow">
      <g transform="translate(0 0)">
        <circle class="ion" cx="300" cy="330" r="13"/><text class="ion-text" x="300" y="331">M⁺</text>
        <circle class="ion" cx="360" cy="390" r="13"/><text class="ion-text" x="360" y="391">M⁺</text>
        <circle class="ion" cx="420" cy="350" r="13"/><text class="ion-text" x="420" y="351">M⁺</text>
      </g>
    </g>
    <g class="charge-flow">
      <g transform="translate(0 0)">
        <circle class="ion" cx="720" cy="330" r="13"/><text class="ion-text" x="720" y="331">M⁺</text>
        <circle class="ion" cx="660" cy="390" r="13"/><text class="ion-text" x="660" y="391">M⁺</text>
        <circle class="ion" cx="600" cy="350" r="13"/><text class="ion-text" x="600" y="351">M⁺</text>
      </g>
    </g>

    <g class="phase-discharge">
      <text class="tiny" x="570" y="310" text-anchor="middle" fill="var(--ink)">放电：工作离子脱出 → 负极嵌入</text>
      <path d="M 250 486 L 930 486" class="stroke" marker-end="url(#arrow-blue)"/>
      <text class="tiny muted" x="590" y="514" text-anchor="middle">external circuit / e⁻</text>
    </g>
    <g class="phase-charge">
      <text class="tiny" x="570" y="310" text-anchor="middle" fill="var(--ink)">充电：工作离子脱出 → 正极回嵌</text>
      <path d="M 930 486 L 250 486" class="stroke" marker-end="url(#arrow-ink)"/>
      <text class="tiny muted" x="590" y="514" text-anchor="middle">external circuit / e⁻</text>
    </g>

    <path id="discharge-electron" d="M 1060 154 C 850 90 350 90 140 154" class="electron dash-discharge" marker-end="url(#arrow-acid)"/>
    <path id="charge-electron" d="M 140 154 C 350 90 850 90 1060 154" class="electron-charge dash-charge" marker-end="url(#arrow-blue)"/>
    <text class="tiny" x="590" y="112" text-anchor="middle" fill="var(--muted)">外电路 · 电子流向随充放电反转</text>
  </g>

  <g transform="translate(70 650)">
    <text class="tiny muted mono" x="0" y="0">VISUAL LANGUAGE</text>
    <g transform="translate(0 22)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#fff0e9" stroke="var(--orange)" stroke-width="2"/>
      <text class="tiny" x="26" y="13">正极 / cathode</text>
      <rect x="190" y="0" width="16" height="16" rx="4" fill="#f4fae0" stroke="var(--green)" stroke-width="2"/>
      <text class="tiny" x="216" y="13">电解质 / electrolyte</text>
      <rect x="430" y="0" width="16" height="16" rx="4" fill="#edf1ff" stroke="var(--blue)" stroke-width="2"/>
      <text class="tiny" x="456" y="13">负极 / anode</text>
      <circle cx="650" cy="8" r="7" fill="var(--acid)" stroke="var(--ink)" stroke-width="2"/>
      <text class="tiny" x="666" y="13">工作离子 M⁺</text>
      <line x1="800" y1="8" x2="846" y2="8" stroke="var(--acid)" stroke-width="3" stroke-dasharray="8 8"/>
      <text class="tiny" x="858" y="13">e⁻ 电子</text>
    </g>
    <text class="tiny muted" x="0" y="66">统一规则：2.5 px 结构线 · 圆形工作离子 · 虚线电子 · 橙=正极 · 绿=电解质 · 蓝=负极 · 5 秒循环</text>
  </g>
</svg>
